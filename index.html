<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOYAGER v3.0 | INTELLIGENT WARNING SYSTEM</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        :root { --neon-green: #00ff88; --neon-blue: #00d9ff; --neon-red: #ff3e3e; --neon-yellow: #f3ff00; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Consolas', monospace; margin: 0; overflow-x: hidden; }
        .header { background: #111; padding: 20px; text-align: center; border-bottom: 2px solid var(--neon-blue); position: relative; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; padding: 20px; }
        
        /* Prediction Matrix */
        .prediction-zone { 
            grid-column: 1 / -1; background: radial-gradient(circle, #001a11 0%, #050505 100%); 
            border: 3px solid var(--neon-green); text-align: center; padding: 40px; border-radius: 20px;
            position: relative; overflow: hidden;
        }
        .essence-box { font-size: 6rem; letter-spacing: 15px; color: var(--neon-green); text-shadow: 0 0 40px var(--neon-green); margin: 20px 0; transition: 0.5s; }
        
        /* Alert Animation */
        .alert-active { animation: blink-bg 1s infinite; }
        @keyframes blink-bg { 0% { border-color: var(--neon-green); } 50% { border-color: var(--neon-yellow); box-shadow: 0 0 50px var(--neon-yellow); } 100% { border-color: var(--neon-green); } }

        .card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 20px; text-align: center; }
        .label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 2px; }
        .value { font-size: 2rem; font-weight: bold; margin: 10px 0; color: var(--neon-blue); }
        .loader { font-size: 0.7rem; color: var(--neon-blue); text-align: center; padding: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
    <py-config> packages = ["yfinance", "pandas"] </py-config>
</head>
<body>

<div class="header" id="main_header">
    <h1 style="margin:0; letter-spacing:5px;">VOYAGER <span style="color:var(--neon-blue);">v3.0</span></h1>
    <div id="sys_clock" style="color:var(--neon-yellow); font-size:0.8rem;">SYSTEM LOADING...</div>
</div>

<div class="grid">
    <div class="prediction-zone" id="alert_box">
        <div class="label">AI TARGET ACQUISITION</div>
        <div id="essence_out" class="essence-box">🛡️</div>
        <div id="status_text" style="color:var(--neon-red); font-weight:bold;">[ ENCRYPTED ]</div>
        <audio id="alert_sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    </div>

    <div class="card"><div class="label">SET Index</div><div id="set_val" class="value">--</div></div>
    <div class="card"><div class="label">Market Value</div><div id="mkt_val" class="value">--</div></div>
    <div class="card"><div class="label">Signal Strength</div><div id="conf_val" class="value" style="color:var(--neon-yellow);">--</div></div>
</div>

<div id="log_status" class="loader">ESTABLISHING SECURE CONNECTION...</div>

<script type="py">
import yfinance as yf
import js
from datetime import datetime

async def run_voyager():
    try:
        # ၁။ ဒေတာဆွဲယူခြင်း
        set_tk = yf.Ticker("^SET.BK")
        hist = set_tk.history(period="15d")
        live = set_tk.history(period="1d", interval="1m")
        
        # ၂။ တွက်ချက်ခြင်း
        results = []
        for date, row in hist.iloc[::-1].iterrows():
            s_idx = row['Close']
            vol = row['Volume']
            v_mil = (vol * s_idx) / 1000000
            h_dig = int(f"{s_idx:.2f}"[-1])
            t_dig = int(str(int(v_mil))[-1])
            drift = int(str(int(vol))[-1])
            essence = f"{abs((h_dig+7)-(t_dig+3))%10}{(drift+5)%10}"
            results.append(essence)

        top_pick = max(set(results), key=results.count)
        
        # ၃။ Live UI Update
        if not live.empty:
            l_row = live.iloc[-1]
            js.document.getElementById("set_val").innerHTML = f"{l_row['Close']:,.2f}"
            js.document.getElementById("mkt_val").innerHTML = f"{(l_row['Volume']*l_row['Close'])/1000000:,.0f}M"

        # ၄။ Time-Lock & Alert Logic
        now = datetime.now()
        total_mins = now.hour * 60 + now.minute
        is_open = (690 <= total_mins < 720) or (960 <= total_mins < 990)

        if is_open:
            js.document.getElementById("essence_out").innerHTML = top_pick
            js.document.getElementById("status_text").innerHTML = "[ TARGET UNLOCKED - ALERT ACTIVE ]"
            js.document.getElementById("status_text").style.color = "#00ff88"
            js.document.getElementById("alert_box").classList.add("alert-active")
            # အသံမြည်စေရန်
            js.document.getElementById("alert_sound").play()
        else:
            js.document.getElementById("essence_out").innerHTML = "🛡️"
            js.document.getElementById("status_text").innerHTML = f"[ STANDBY - NEXT SYNC: {now.strftime('%H:%M')} ]"
            js.document.getElementById("alert_box").classList.remove("alert-active")

        js.document.getElementById("sys_clock").innerHTML = now.strftime("%H:%M:%S | NODE_01")
        js.document.getElementById("log_status").innerHTML = "V3.0 CORE STABLE"

    except Exception as e:
        js.document.getElementById("log_status").innerHTML = f"CRITICAL: {str(e)}"

run_voyager()
</script>
</body>
</html>
