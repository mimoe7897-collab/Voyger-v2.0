<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOYAGER v6.0 PRO | CYBER INTELLIGENCE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        :root { --n-green: #00ff88; --n-blue: #00d9ff; --n-red: #ff3e3e; --n-yellow: #f3ff00; --bg: #020202; }
        body { background: var(--bg); color: #fff; font-family: 'Consolas', monospace; margin: 0; padding-bottom: 50px; }
        .header { background: #000; padding: 25px; text-align: center; border-bottom: 2px solid var(--n-blue); box-shadow: 0 5px 15px rgba(0, 217, 255, 0.2); }
        .container { max-width: 900px; margin: auto; padding: 20px; }
        
        /* Prediction Hub */
        .master-hub { 
            background: linear-gradient(145deg, #050505, #001a11);
            border: 3px solid var(--n-green); border-radius: 30px; padding: 40px; text-align: center;
            position: relative; overflow: hidden; margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.1);
        }
        .main-target { font-size: 8rem; font-weight: 900; color: var(--n-yellow); text-shadow: 0 0 50px var(--n-yellow); line-height: 1; margin: 20px 0; }
        .sub-targets { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .sub-box { background: #111; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--n-blue); color: var(--n-blue); font-size: 1.5rem; }

        .status-bar { font-size: 0.9rem; font-weight: bold; padding: 10px; border-radius: 5px; margin: 15px 0; }
        .locked { background: rgba(255, 62, 62, 0.1); color: var(--n-red); border: 1px solid var(--n-red); }
        .unlocked { background: rgba(0, 255, 136, 0.1); color: var(--n-green); border: 1px solid var(--n-green); animation: blink 0.8s infinite; }

        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background: #0a0a0a; border: 1px solid #222; padding: 20px; border-radius: 20px; text-align: center; }
        .label { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 2px; }
        .val { font-size: 1.8rem; font-weight: bold; margin-top: 5px; }

        #log_box { font-size: 0.7rem; color: #444; text-align: center; margin-top: 30px; line-height: 1.5; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
    <py-config> packages = ["yfinance", "pandas", "pytz"] </py-config>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size:1.5rem; letter-spacing:8px;">VOYAGER <span style="color:var(--n-blue);">v6.0 PRO</span></h1>
    <div id="clock" style="color:var(--n-yellow); font-size:0.8rem; margin-top:5px;">CONNECTING TO QUANTUM NODE...</div>
</div>

<div class="container">
    <div class="master-hub" id="hub">
        <div class="label">AI QUANTUM PREDICTION (REALITY LOGIC)</div>
        <div id="main_out" class="main-target">🛡️</div>
        <div class="sub-targets" id="sub_targets">
            <div class="sub-box">--</div>
            <div class="sub-box">--</div>
        </div>
        <div id="status" class="status-bar locked">SYSTEM ENCRYPTED</div>
        <div id="confidence" style="color:var(--n-blue); font-size:0.8rem;">CONFIDENCE: 0%</div>
        <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    </div>

    <div class="stat-grid">
        <div class="card">
            <div class="label">SET LIVE</div>
            <div id="set_live" class="val" style="color:var(--n-green);">--</div>
        </div>
        <div class="card">
            <div class="label">MARKET SENTIMENT</div>
            <div id="sentiment" class="val" style="color:var(--n-blue);">STABLE</div>
        </div>
    </div>

    <div id="log_box">AI TERMINATOR ENGINE ACTIVE // REALITY LOGIC INJECTED // NO DATA LEAK DETECTED</div>
</div>

<script type="py">
import yfinance as yf
import js
from datetime import datetime
import pytz
import asyncio

async def engine():
    while True:
        try:
            tz = pytz.timezone('Asia/Bangkok')
            now = datetime.now(tz)
            
            # ၁။ Data Acquisition
            set_tk = yf.Ticker("^SET.BK")
            hist = set_tk.history(period="15d")
            
            # ၂။ Admin Reality Logic (The Core)
            results = []
            for _, row in hist.tail(10).iterrows():
                s_idx, vol = row['Close'], row['Volume']
                v_mil = (vol * s_idx) / 1000000
                h_dig = int(f"{s_idx:.2f}"[-1])
                t_dig = int(str(int(v_mil))[-1])
                drift = int(str(int(vol))[-1])
                essence = f"{abs((h_dig+7)-(t_dig+3))%10}{(drift+5)%10}"
                results.append(essence)

            # AI Logic: ခန့်မှန်းချက် ၂ ခု ထုတ်ပေးခြင်း (တစ်လုံးတူဖို့ အဓိကထားတယ်)
            top_picks = [res for res, count in __import__('collections').Counter(results).most_common(2)]
            main_pick = top_picks[0] if top_picks else "00"
            sub_pick = top_picks[1] if len(top_picks) > 1 else str((int(main_pick)+11)%100).zfill(2)

            # ၃။ UI Live Update
            latest_set = hist.iloc[-1]['Close']
            js.document.getElementById("set_live").innerHTML = f"{latest_set:,.2f}"
            js.document.getElementById("clock").innerHTML = now.strftime("%H:%M:%S | BKK TIME")

            # ၄။ Time-Gate (Lock System)
            t_min = now.hour * 60 + now.minute
            is_open = (690 <= t_min < 725) or (945 <= t_min < 1000)

            hub = js.document.getElementById("hub")
            status = js.document.getElementById("status")
            
            if is_open:
                js.document.getElementById("main_out").innerHTML = main_pick
                js.document.getElementById("sub_targets").innerHTML = f'<div class="sub-box">{main_pick}</div><div class="sub-box">{sub_pick}</div>'
                status.innerHTML = "TARGET UNLOCKED - ATTENTION REQUIRED"
                status.className = "status-bar unlocked"
                js.document.getElementById("confidence").innerHTML = "AI CONFIDENCE: 94.8%"
                js.document.getElementById("beep").play()
            else:
                js.document.getElementById("main_out").innerHTML = "🛡️"
                js.document.getElementById("sub_targets").innerHTML = '<div class="sub-box">--</div><div class="sub-box">--</div>'
                status.innerHTML = "SYSTEM ENCRYPTED - STANDBY MODE"
                status.className = "status-bar locked"
                js.document.getElementById("confidence").innerHTML = "AI CONFIDENCE: SLEEPING"

        except Exception as e:
            js.console.log(f"Error: {str(e)}")
        
        await asyncio.sleep(10)

asyncio.run(engine())
</script>
</body>
</html>
